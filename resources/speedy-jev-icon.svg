<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Speedy Jev icon ("Break-out"): white "Jev" on an electric-blue tile, with the Speedy
       lightning bolt bursting out past the tile's top-right corner.
       Source for public/icon/*.png — regenerate with `npm run icons`. -->
  <defs>
    <linearGradient id="tile-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b6bff"/>
      <stop offset="1" stop-color="#2233c4"/>
    </linearGradient>
    <linearGradient id="bolt-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
  </defs>

  <rect x="4" y="14" width="110" height="110" rx="26" fill="url(#tile-fill)"/>

  <g transform="translate(59 71) scale(0.9) translate(-62 -61)" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M33 36 V74 A11 11 0 0 1 11 74"/>
    <path d="M49 72 H75 A13 13 0 1 0 71.2 81.2"/>
    <path d="M87 58 L100 85 L113 58"/>
  </g>

  <path transform="translate(64 -1) scale(0.7)" d="M58 4 L18 58 H46 L38 96 L82 38 H54 Z" fill="url(#bolt-fill)" stroke="#b7791f" stroke-width="3" stroke-linejoin="round"/>
</svg>
